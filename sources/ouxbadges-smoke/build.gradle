plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

// Server smoke test for GoldClaim ranks shown by Oux Badges. Drop the remapped jar into a disposable
// Fabric server with GoldClaim, Oux Badges and LuckPerms; it writes ouxbadges-smoke-result.txt and halts.
version = '1.0.0'
group = 'com.gangs.ouxbadges.smoke'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modCompileOnly 'net.fabricmc.fabric-api:fabric-api:0.92.11+1.20.1'
    compileOnly 'net.luckperms:api:5.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

base {
    archivesName = 'ouxbadges-smoke'
}
