plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' }
    ivy {
        url 'https://mediafilez.forgecdn.net/files/7147/929'
        patternLayout { artifact '[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'pack.sophisticated' }
    }
}

configurations {
    gravesUpstream
    backpacksUpstream
}
dependencies {
    gravesUpstream 'maven.modrinth:universal-graves:66RxRZcI'
    backpacksUpstream 'pack.sophisticated:sophisticatedbackpacks:1.20.1-3.23.4.5.110'
}
def gravesJar = configurations.gravesUpstream.singleFile
def upstreamHash = java.security.MessageDigest.getInstance('SHA-512')
    .digest(gravesJar.bytes).encodeHex().toString()
if (upstreamHash != 'c76d26e1bd0b3ce48c211729662b940b99d3ab5d9661fe007625840152ca064262625090d152eff93e3c4588a4cd33d353c33c31bc111b43f87a71b25f45cba1') {
    throw new GradleException('Universal Graves does not match the pack-pinned release.')
}
if (java.security.MessageDigest.getInstance('SHA-1')
    .digest(configurations.backpacksUpstream.singleFile.bytes).encodeHex().toString() !=
    'a4f49de0f9df379cb151dde440467b90e8923724') {
    throw new GradleException('Sophisticated Backpacks does not match the pack-pinned release.')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation 'maven.modrinth:universal-graves:66RxRZcI'
    modCompileOnly 'pack.sophisticated:sophisticatedbackpacks:1.20.1-3.23.4.5.110'
}

// Fabric development launches do not discover a dependency's nested mods.
def nestedDirectory = layout.buildDirectory.dir('graves-nested-runtime').get().asFile
nestedDirectory.mkdirs()
def seen = new HashSet<String>()
def addNested
addNested = { File parent ->
    new java.util.zip.ZipFile(parent).withCloseable { zip ->
        for (def entry in zip.entries().findAll {
            it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar')
        }) {
            if (!seen.add(entry.name)) continue
            def nested = new File(nestedDirectory, entry.name.tokenize('/').last())
            zip.getInputStream(entry).withCloseable { nested.bytes = it.readAllBytes() }
            dependencies.add('modRuntimeOnly', files(nested))
            addNested(nested)
        }
    }
}
addNested(gravesJar)

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('smokeJar', Jar) {
    archiveBaseName = 'gangsgravescompat-smoke'
    archiveVersion = '1.0.0'
    from sourceSets.testmod.output
}

tasks.register('remapSmokeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('smokeJar')
    inputFile = tasks.named('smokeJar').flatMap { it.archiveFile }
    archiveBaseName = 'gangsgravescompat-smoke'
    archiveVersion = '1.0.0'
    archiveClassifier = 'production'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    mixin {
        add sourceSets.main, 'gangsgravescompat-refmap.json'
    }
    mods {
        gangsgravescompat { sourceSet sourceSets.main }
        gangsgravescompat_smoke { sourceSet sourceSets.testmod }
    }
    runs {
        graveSmoke {
            server()
            source sourceSets.testmod
            runDir '../../tmp/gangsgravescompat-smoke'
            vmArg '-Xmx1G'
            vmArg '-XX:ActiveProcessorCount=2'
            programArg 'nogui'
        }
    }
}

tasks.named('runGraveSmoke') {
    doFirst {
        def directory = file('../../tmp/gangsgravescompat-smoke')
        def eula = new File(directory, 'eula.txt')
        if (!eula.exists() || !(eula.text =~ /(?m)^eula=true\s*$/).find()) {
            throw new GradleException('Copy an accepted Minecraft eula.txt into tmp/gangsgravescompat-smoke first.')
        }
        new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-query=false
enable-rcon=false
level-name=smoke-world
level-type=minecraft:flat
generate-structures=false
view-distance=2
simulation-distance=2
max-tick-time=60000
'''
        def result = new File(directory, 'grave-smoke-passed.txt')
        if (result.exists() && !result.delete()) throw new GradleException('Cannot clear previous smoke result.')
    }
    doLast {
        if (!file('../../tmp/gangsgravescompat-smoke/grave-smoke-passed.txt').exists()) {
            throw new GradleException('Safe grave integration checks did not pass.')
        }
    }
}
