plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	testmod {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
	}
}

loom {
	mods {
		gangshop { sourceSet sourceSets.main }
		if (project.hasProperty('shopSmoke')) {
			shoptest { sourceSet sourceSets.testmod }
		}
	}
	if (project.hasProperty('shopTestRunDir')) {
		runs {
			server {
				runDir project.relativePath(file(project.property('shopTestRunDir')))
				if (project.hasProperty('shopSmoke')) source sourceSets.testmod
			}
		}
	}
}

repositories {
	mavenCentral()
	flatDir {
		dirs '../../artifacts'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly files('../../artifacts/gang-shop-ozsoihjx.jar')
	if (project.hasProperty('shopSmoke')) modRuntimeOnly files('../../artifacts/gang-shop-ozsoihjx.jar')
	testImplementation 'junit:junit:4.13.2'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
