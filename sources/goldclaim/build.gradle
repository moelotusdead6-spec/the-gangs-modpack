plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url 'https://api.modrinth.com/maven' }
	ivy {
		url 'https://mediafilez.forgecdn.net/files/7682/268'
		patternLayout { artifact '[artifact].[ext]' }
		metadataSources { artifact() }
		content { includeGroup 'waystones-pinned' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "net.luckperms:api:5.4"
	modCompileOnly 'maven.modrinth:balm:sWBQARQL'
	modCompileOnly 'waystones-pinned:waystones-fabric-1.20.1-14.1.20:14.1.20@jar'
	testImplementation 'junit:junit:4.13.2'
	testRuntimeOnly "net.luckperms:api:5.4"
	if (project.hasProperty('smokePlushieJar')) {
		modRuntimeOnly files(project.property('smokePlushieJar'))
	}
	for (propertyName in ['smokeMultiworldJar', 'smokeTrueEndingJar', 'smokeFantasyJar']) {
		if (project.hasProperty(propertyName)) {
			modRuntimeOnly files(project.property(propertyName))
		}
	}
	if (project.hasProperty('smokeModsDir')) {
		modRuntimeOnly fileTree(dir: project.property('smokeModsDir'), include: '*.jar')
	}
}

sourceSets {
	maintenance
	testmod {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
	}
}

dependencies {
	maintenanceImplementation 'net.kyori:adventure-nbt:4.26.1'
	maintenanceImplementation 'com.google.code.gson:gson:2.10.1'
	testImplementation sourceSets.maintenance.output
	testImplementation 'net.kyori:adventure-nbt:4.26.1'
}

tasks.register('legacyTeleportPurgeJar', Jar) {
	archiveBaseName = 'gangs-teleport-purge'
	archiveVersion = '1.0.1'
	manifest { attributes 'Main-Class': 'com.elysium.goldclaim.maintenance.LegacyTeleportPurge' }
	from sourceSets.maintenance.output
	from { configurations.maintenanceRuntimeClasspath.collect { zipTree(it) } }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('playerRecoveryJar', Jar) {
	archiveBaseName = 'gangs-player-recovery'
	archiveVersion = '1.0.0'
	manifest { attributes 'Main-Class': 'com.elysium.goldclaim.maintenance.PlayerRecovery' }
	from sourceSets.maintenance.output
	from { configurations.maintenanceRuntimeClasspath.collect { zipTree(it) } }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

loom {
	mods {
		goldclaim { sourceSet sourceSets.main }
		goldclaim_policy_smoke { sourceSet sourceSets.testmod }
	}
	runs {
		policySmoke {
			server()
			name 'Isolated GoldClaim policy smoke test'
			source sourceSets.testmod
			runDir '../../tmp/goldclaim-policy-smoke'
			programArg 'nogui'
		}
		rswSmoke {
			server()
			name 'Isolated RSW True Ending smoke test'
			source sourceSets.testmod
			runDir '../../tmp/goldclaim-rsw-smoke'
			vmArg '-Xmx2G'
			vmArg '-XX:ActiveProcessorCount=4'
			environmentVariable 'GOLDCLAIM_RSW_SMOKE', 'true'
			programArg 'nogui'
		}
	}

	tasks.named('runRswSmoke') {
		doFirst {
			def directory = file('../../tmp/goldclaim-rsw-smoke')
			def eula = new File(directory, 'eula.txt')
			if (!eula.exists() || !(eula.text =~ /(?m)^eula=true\s*$/).find()) {
				throw new GradleException('Copy your accepted eula.txt into tmp/goldclaim-rsw-smoke first.')
			}
			for (generated in ['smoke-world', 'config/multiworld', 'config/goldclaim', 'backups', '.rsw-reset-in-progress']) {
				delete new File(directory, generated)
			}
			new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
	server-port=0
	online-mode=false
	enable-query=false
	enable-rcon=false
	level-name=smoke-world
	level-seed=12345
	view-distance=2
	simulation-distance=2
	max-tick-time=60000
	'''
			copy {
				from '../../config/paxi/datapacks/gangs_fixes'
				into new File(directory, 'smoke-world/datapacks/gangs_fixes')
			}
			copy {
				from '../../config/paxi/datapacks/gangs_hub'
				into new File(directory, 'smoke-world/datapacks/gangs_hub')
			}
			def homes = new File(directory, 'config/goldclaim/player-homes.json')
			homes.parentFile.mkdirs()
			homes.text = '''[
{"playerUuid":"00000000-0000-0000-0000-000000000117","name":"stale-nether","worldId":"minecraft:the_nether","x":0.5,"y":100,"z":0.5},
{"playerUuid":"00000000-0000-0000-0000-000000000117","name":"stale-end","worldId":"minecraft:the_end","x":0.5,"y":100,"z":0.5},
{"playerUuid":"00000000-0000-0000-0000-000000000117","name":"allowed-wild","worldId":"minecraft:overworld","x":64.5,"y":100,"z":64.5}
]
'''
			copy {
				from '../../config/randomcollections/config.json'
				into new File(directory, 'config/randomcollections')
			}
			def result = new File(directory, 'rsw-smoke-passed.txt')
			if (result.exists() && !result.delete()) {
				throw new GradleException('Cannot clear the previous RSW smoke-test result.')
			}
		}
		doLast {
			if (!file('../../tmp/goldclaim-rsw-smoke/rsw-smoke-passed.txt').exists()) {
				throw new GradleException('RSW dragon verification did not produce a passing result.')
			}
		}
	}
}

tasks.named('runPolicySmoke') {
	doFirst {
		def directory = file('../../tmp/goldclaim-policy-smoke')
		def eula = new File(directory, 'eula.txt')
		if (!eula.exists() || !(eula.text =~ /(?m)^eula=true\s*$/).find()) {
			throw new GradleException('Copy your accepted Minecraft eula.txt into tmp/goldclaim-policy-smoke before running the fixture.')
		}
		new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-query=false
enable-rcon=false
level-name=smoke-world
level-type=minecraft:flat
generate-structures=false
view-distance=2
simulation-distance=2
max-tick-time=60000
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
'''
		def result = new File(directory, 'policy-smoke-passed.txt')
		if (result.exists() && !result.delete()) {
			throw new GradleException('Cannot clear the previous policy smoke-test result.')
		}
		copy {
			from '../../config/randomcollections/config.json'
			into new File(directory, 'config/randomcollections')
		}
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
