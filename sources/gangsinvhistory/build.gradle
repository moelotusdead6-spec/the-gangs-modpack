plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' }
    ivy {
        url 'https://mediafilez.forgecdn.net/files/7147/929'
        patternLayout { artifact '[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'pack.sophisticated' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly 'maven.modrinth:fabric-permissions-api:0.3.1'
    modCompileOnly 'pack.sophisticated:sophisticatedbackpacks:1.20.1-3.23.4.5.110'
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('smokeJar', Jar) {
    archiveBaseName = 'gangsinvhistory-smoke'
    archiveVersion = '1.0.0'
    from sourceSets.testmod.output
}

tasks.register('remapSmokeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('smokeJar')
    inputFile = tasks.named('smokeJar').flatMap { it.archiveFile }
    archiveBaseName = 'gangsinvhistory-smoke'
    archiveVersion = '1.0.0'
    archiveClassifier = 'production'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def failDisconnect = providers.gradleProperty('historySmokeFailDisconnect').map { it.toBoolean() }.orElse(false)

loom {
    mixin {
        add sourceSets.main, 'gangsinvhistory-refmap.json'
        add sourceSets.testmod, 'gangsinvhistory_smoke-refmap.json'
    }
    mods {
        gangsinvhistory { sourceSet sourceSets.main }
        gangsinvhistory_smoke { sourceSet sourceSets.testmod }
    }
    runs {
        historySmoke {
            server()
            source sourceSets.testmod
            runDir '../../tmp/gangsinvhistory-smoke'
            vmArg '-Xmx1G'
            vmArg '-XX:ActiveProcessorCount=2'
            if (failDisconnect.get()) vmArg '-Dgangsinvhistory.smoke.failDisconnect=true'
            programArg 'nogui'
        }
    }
}

def clearSmokeResult = { File directory ->
    def eula = new File(directory, 'eula.txt')
    if (!eula.exists() || !(eula.text =~ /(?m)^eula=true\s*$/).find()) {
        throw new GradleException("Copy an accepted Minecraft eula.txt into ${directory} first.")
    }
    def result = new File(directory, 'history-smoke-passed.txt')
    if (result.exists() && !result.delete()) throw new GradleException('Cannot clear previous smoke result.')
}

def verifySmokeResult = { File directory, boolean expectFailure, boolean expectBackpacks ->
    def result = new File(directory, 'history-smoke-passed.txt')
    def text = result.exists() ? result.text : ''
    if (!text.startsWith('PASS:') || text.contains('injected RejectedExecutionException') != expectFailure
        || (expectBackpacks && !text.contains('fresh Sophisticated Backpacks storage persisted'))) {
        throw new GradleException("Inventory history checks did not pass; see ${directory}/logs/latest.log.")
    }
    logger.lifecycle(text.trim())
}

tasks.named('runHistorySmoke') {
    def directory = file('../../tmp/gangsinvhistory-smoke')
    doFirst {
        clearSmokeResult(directory)
        new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-query=false
enable-rcon=false
level-name=smoke-world
level-type=minecraft:flat
generate-structures=false
view-distance=2
simulation-distance=2
max-tick-time=60000
'''
    }
    doLast {
        verifySmokeResult(directory, failDisconnect.get(), false)
    }
}

tasks.register('runHistoryProductionSmoke', Exec) {
    group = 'verification'
    description = 'Tests the remapped release jar and shutdown recovery in the isolated Fabric fixture.'
    def release = tasks.named('remapJar')
    def smoke = tasks.named('remapSmokeJar')
    dependsOn release, smoke
    def directory = file('../../tmp/gangsinvhistory-production')
    workingDir directory
    commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
        '-Xmx2G', '-XX:ActiveProcessorCount=2', '-Dgangsinvhistory.smoke.failDisconnect=true',
        '-jar', 'fabric-server-launch.jar', 'nogui'
    doFirst {
        // Never run this task in a real server directory.
        def properties = new Properties()
        new File(directory, 'server.properties').withInputStream { properties.load(it) }
        if (properties.getProperty('server-ip') != '127.0.0.1' || properties.getProperty('server-port') != '0'
            || properties.getProperty('level-name') != 'smoke-world') {
            throw new GradleException('Production smoke requires the local smoke-world fixture on a loopback ephemeral port.')
        }
        clearSmokeResult(directory)
        project.copy {
            from release.get().archiveFile.get().asFile, smoke.get().archiveFile.get().asFile
            into new File(directory, 'mods')
        }
    }
    doLast {
        verifySmokeResult(directory, true, true)
    }
}
